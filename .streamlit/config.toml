# Streamlit's own theme. app/theme.py styles everything CSS can reach, but the
# widgets Streamlit renders itself — text-input frames, focus rings, spinners —
# take their colours from here, so these must match the tokens in theme.py or
# those controls end up the only light-mode things on a dark page.
[theme]
base = "dark"
primaryColor = "#6ff2c0"
backgroundColor = "#0c0d10"
secondaryBackgroundColor = "#14161a"
textColor = "#f2f2f0"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
